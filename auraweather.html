<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraWeather - Smart Weather, AQI & World Clock</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Dynamic Theme Transitions */
        body {
            transition: background 1s ease, color 1s ease;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body id="appBody" class="min-h-screen bg-gradient-to-br from-blue-500 to-indigo-700 text-white font-sans p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header & Search -->
        <header class="flex flex-col md:flex-row justify-between items-center gap-4 glass-panel p-4 rounded-2xl shadow-lg">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-cloud-sun-rain text-3xl"></i>
                <h1 class="text-2xl font-bold tracking-wide">AuraWeather</h1>
            </div>
            <div class="flex items-center gap-2 w-full md:w-auto">
                <input type="text" id="cityInput" placeholder="Search city..." 
                    class="px-4 py-2 rounded-xl bg-white/20 placeholder-white/70 text-white focus:outline-none focus:ring-2 focus:ring-white/50 w-full md:w-64">
                <button onclick="fetchWeather()" class="px-5 py-2 rounded-xl bg-white/30 hover:bg-white/40 font-semibold transition">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </header>

        <!-- Main Weather Hero Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Current Weather Card -->
            <div class="glass-panel p-6 rounded-3xl shadow-xl md:col-span-2 flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 id="cityName" class="text-3xl font-extrabold">Loading...</h2>
                            <p id="currentDate" class="text-sm text-white/80">--</p>
                        </div>
                        <span id="weatherThemeBadge" class="px-3 py-1 text-xs font-bold uppercase tracking-wider bg-white/20 rounded-full">--</span>
                    </div>
                    <div class="flex items-center my-6 gap-6">
                        <i id="weatherIcon" class="fa-solid fa-sun text-6xl"></i>
                        <div>
                            <div class="text-6xl font-black" id="temperature">--°C</div>
                            <p id="weatherCondition" class="text-lg capitalize text-white/90">--</p>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2 pt-4 border-t border-white/20 text-center">
                    <div>
                        <p class="text-xs text-white/70">Humidity</p>
                        <p id="humidity" class="font-bold text-lg">--%</p>
                    </div>
                    <div>
                        <p class="text-xs text-white/70">Wind Speed</p>
                        <p id="windSpeed" class="font-bold text-lg">-- km/h</p>
                    </div>
                    <div>
                        <p class="text-xs text-white/70">Feels Like</p>
                        <p id="feelsLike" class="font-bold text-lg">--°C</p>
                    </div>
                </div>
            </div>

            <!-- AQI & UV Index Card -->
            <div class="glass-panel p-6 rounded-3xl shadow-xl flex flex-col justify-between space-y-4">
                <div>
                    <h3 class="text-lg font-bold mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-shield-heart"></i> Air & UV Quality
                    </h3>
                    
                    <!-- AQI Widget -->
                    <div class="mb-4">
                        <div class="flex justify-between text-sm mb-1">
                            <span>Air Quality (AQI)</span>
                            <span id="aqiStatus" class="font-bold">--</span>
                        </div>
                        <div class="w-full bg-black/20 h-3 rounded-full overflow-hidden">
                            <div id="aqiBar" class="bg-green-400 h-full w-0 transition-all duration-500"></div>
                        </div>
                    </div>

                    <!-- UV Index Widget -->
                    <div>
                        <div class="flex justify-between text-sm mb-1">
                            <span>UV Index Warning</span>
                            <span id="uvStatus" class="font-bold">--</span>
                        </div>
                        <p id="uvAdvice" class="text-xs text-white/80 mt-1">Fetching safety advice...</p>
                    </div>
                </div>
                <div class="text-xs text-white/60 text-center pt-2 border-t border-white/20">
                    Smart Dynamic Environment Tracker
                </div>
            </div>

        </div>

        <!-- Hourly Forecast Section -->
        <div class="glass-panel p-6 rounded-3xl shadow-xl">
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-clock"></i> Hourly Forecast
            </h3>
            <div id="hourlyContainer" class="flex gap-4 overflow-x-auto pb-2 scrollbar-thin">
                <div class="text-sm text-white/70">Loading forecast...</div>
            </div>
        </div>

        <!-- World Clock & Local Time Hub Section -->
        <div class="glass-panel p-6 rounded-3xl shadow-xl space-y-6">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <h3 class="text-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-globe"></i> World Clocks Hub
                </h3>
                <!-- Add World Clock Form -->
                <div class="flex items-center gap-2 w-full md:w-auto">
                    <select id="timezoneSelect" class="px-4 py-2 rounded-xl bg-white/20 text-white focus:outline-none focus:ring-2 focus:ring-white/50 w-full md:w-64">
                        <option value="America/New_York" class="bg-slate-800 text-white">New York (USA)</option>
                        <option value="Europe/London" class="bg-slate-800 text-white">London (UK)</option>
                        <option value="Europe/Paris" class="bg-slate-800 text-white">Paris (France)</option>
                        <option value="Asia/Tokyo" class="bg-slate-800 text-white">Tokyo (Japan)</option>
                        <option value="Australia/Sydney" class="bg-slate-800 text-white">Sydney (Australia)</option>
                        <option value="Asia/Dubai" class="bg-slate-800 text-white">Dubai (UAE)</option>
                        <option value="America/Los_Angeles" class="bg-slate-800 text-white">Los Angeles (USA)</option>
                        <option value="Asia/Singapore" class="bg-slate-800 text-white">Singapore</option>
                    </select>
                    <button onclick="addWorldClock()" class="px-4 py-2 rounded-xl bg-white/30 hover:bg-white/40 font-semibold transition whitespace-nowrap">
                        <i class="fa-solid fa-plus"></i> Add Clock
                    </button>
                </div>
            </div>

            <!-- Clocks Grid Container -->
            <div id="clocksContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- Dynamically injected clocks (Local Clock is added by default) -->
            </div>
        </div>

    </div>

    <!-- Application Script -->
    <script>
        // Store user added world clocks
        let worldClocks = [
            { name: "Local Time", zone: Intl.DateTimeFormat().resolvedOptions().timeZone, isLocal: true },
            { name: "New York (USA)", zone: "America/New_York", isLocal: false },
            { name: "Tokyo (Japan)", zone: "Asia/Tokyo", isLocal: false }
        ];

        // Default city load
        window.addEventListener('DOMContentLoaded', () => {
            getWeatherData("Kolkata");
            initClocks();
            // Update clocks every second
            setInterval(updateClocks, 1000);
        });

        async function fetchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (city) {
                getWeatherData(city);
            }
        }

        async function getWeatherData(cityNameQuery) {
            try {
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityNameQuery)}&count=1`);
                const geoData = await geoRes.json();
                
                if (!geoData.results || geoData.results.length === 0) {
                    alert("City not found. Please try another location.");
                    return;
                }

                const { latitude, longitude, name, country, timezone } = geoData.results[0];
                document.getElementById('cityName').innerText = `${name}, ${country || ''}`;

                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,uv_index&air_quality=european_aqi&timezone=auto`);
                const data = await weatherRes.json();

                updateUI(data);

            } catch (error) {
                console.error("Error fetching weather data:", error);
                alert("Failed to fetch weather information. Please check your connection.");
            }
        }

        function updateUI(data) {
            const current = data.current;
            const hourly = data.hourly;
            
            document.getElementById('temperature').innerText = `${Math.round(current.temperature_2m)}°C`;
            document.getElementById('humidity').innerText = `${current.relative_humidity_2m}%`;
            document.getElementById('windSpeed').innerText = `${current.wind_speed_10m} km/h`;
            document.getElementById('feelsLike').innerText = `${Math.round(current.apparent_temperature)}°C`;

            const currentDateStr = new Date(current.time).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            document.getElementById('currentDate').innerText = currentDateStr;

            const wCode = current.weather_code;
            const isDay = current.is_day;
            const conditionInfo = interpretWeatherCode(wCode, isDay);

            document.getElementById('weatherCondition').innerText = conditionInfo.text;
            document.getElementById('weatherIcon').className = `fa-solid ${conditionInfo.icon} text-6xl`;
            document.getElementById('weatherThemeBadge').innerText = isDay ? "Daytime" : "Nighttime";

            applyDynamicTheme(conditionInfo.theme, isDay);

            const aqiVal = data.hourly.european_aqi ? data.hourly.european_aqi[0] : 30;
            updateAQIWidget(aqiVal);

            const currentHourIndex = new Date().getHours();
            const uvVal = hourly.uv_index ? hourly.uv_index[currentHourIndex] : 3;
            updateUVWidget(uvVal);

            renderHourlyForecast(hourly, currentHourIndex);
        }

        function interpretWeatherCode(code, isDay) {
            if (code === 0) return { text: isDay ? "Sunny" : "Clear Sky", icon: isDay ? "fa-sun" : "fa-moon", theme: "sunny" };
            if ([1, 2].includes(code)) return { text: "Partly Cloudy", icon: isDay ? "fa-cloud-sun" : "fa-cloud-moon", theme: "cloudy" };
            if (code === 3) return { text: "Overcast", icon: "fa-cloud", theme: "cloudy" };
            if ([51, 53, 55, 61, 63, 65, 80, 81].includes(code)) return { text: "Rain Showers", icon: "fa-cloud-rain", theme: "rainy" };
            if ([71, 73, 75, 85].includes(code)) return { text: "Snowfall", icon: "fa-snowflake", theme: "snow" };
            if ([95, 96, 99].includes(code)) return { text: "Thunderstorm", icon: "fa-cloud-bolt", theme: "storm" };
            return { text: "Fair Weather", icon: "fa-cloud", theme: "sunny" };
        }

        function applyDynamicTheme(theme, isDay) {
            const body = document.getElementById('appBody');
            if (!isDay) {
                body.className = "min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-purple-950 text-white font-sans p-4 md:p-8";
                return;
            }

            switch(theme) {
                case 'sunny':
                    body.className = "min-h-screen bg-gradient-to-br from-amber-400 via-orange-500 to-sky-400 text-white font-sans p-4 md:p-8";
                    break;
                case 'rainy':
                    body.className = "min-h-screen bg-gradient-to-br from-slate-700 via-blue-900 to-slate-800 text-white font-sans p-4 md:p-8";
                    break;
                case 'cloudy':
                    body.className = "min-h-screen bg-gradient-to-br from-sky-600 via-slate-500 to-zinc-700 text-white font-sans p-4 md:p-8";
                    break;
                case 'storm':
                    body.className = "min-h-screen bg-gradient-to-br from-gray-900 via-purple-950 to-black text-white font-sans p-4 md:p-8";
                    break;
                default:
                    body.className = "min-h-screen bg-gradient-to-br from-blue-500 to-indigo-700 text-white font-sans p-4 md:p-8";
            }
        }

        function updateAQIWidget(aqi) {
            let status = "Good";
            let color = "bg-green-400";
            if (aqi > 40) { status = "Fair"; color = "bg-yellow-400"; }
            if (aqi > 80) { status = "Moderate"; color = "bg-orange-400"; }
            if (aqi > 120) { status = "Poor"; color = "bg-red-400"; }
            if (aqi > 200) { status = "Very Poor"; color = "bg-purple-600"; }

            document.getElementById('aqiStatus').innerText = `${status} (${aqi})`;
            const bar = document.getElementById('aqiBar');
            bar.className = `${color} h-full transition-all duration-500`;
            bar.style.width = `${Math.min((aqi / 150) * 100, 100)}%`;
        }

        function updateUVWidget(uv) {
            let advice = "Safe to be outside.";
            let statusText = `UV Index: ${uv.toFixed(1)}`;
            if (uv >= 3 && uv < 6) { advice = "Moderate risk: Wear sunglasses & sunscreen."; }
            else if (uv >= 6 && uv < 8) { advice = "High risk: Seek shade during midday hours!"; }
            else if (uv >= 8) { advice = "Very High risk: Avoid direct sun exposure!"; }

            document.getElementById('uvStatus').innerText = statusText;
            document.getElementById('uvAdvice').innerText = advice;
        }

        function renderHourlyForecast(hourly, currentIndex) {
            const container = document.getElementById('hourlyContainer');
            container.innerHTML = '';

            for (let i = currentIndex; i < currentIndex + 24 && i < hourly.time.length; i++) {
                const timeStr = new Date(hourly.time[i]).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
                const temp = Math.round(hourly.temperature_2m[i]);
                const code = hourly.weather_code[i];
                const info = interpretWeatherCode(code, 1);

                const card = document.createElement('div');
                card.className = "flex flex-col items-center justify-between p-3 min-w-[80px] bg-white/10 rounded-2xl border border-white/10 shrink-0";
                card.innerHTML = `
                    <span class="text-xs text-white/80">${timeStr}</span>
                    <i class="fa-solid ${info.icon} text-2xl my-2"></i>
                    <span class="font-bold text-lg">${temp}°C</span>
                `;
                container.appendChild(card);
            }
        }

        // --- World Clocks Functionality ---
        function initClocks() {
            updateClocks();
        }

        function updateClocks() {
            const container = document.getElementById('clocksContainer');
            container.innerHTML = '';

            worldClocks.forEach((clock, index) => {
                const now = new Date();
                const timeString = now.toLocaleTimeString('en-US', { timeZone: clock.zone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
                const dateString = now.toLocaleDateString('en-US', { timeZone: clock.zone, weekday: 'short', month: 'short', day: 'numeric' });

                const card = document.createElement('div');
                card.className = "bg-white/10 border border-white/20 rounded-2xl p-4 flex flex-col justify-between relative group";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start">
                            <span class="text-xs font-bold uppercase tracking-wider text-white/70">${clock.name}</span>
                            ${!clock.isLocal ? `<button onclick="removeWorldClock(${index})" class="text-white/50 hover:text-red-300 transition text-sm"><i class="fa-solid fa-xmark"></i></button>` : '<span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full">Primary</span>'}
                        </div>
                        <div class="text-2xl font-black mt-2 tracking-tight">${timeString}</div>
                    </div>
                    <div class="text-xs text-white/70 mt-2 pt-2 border-t border-white/10 flex justify-between">
                        <span>${dateString}</span>
                        <span class="font-mono text-[11px]">${clock.zone}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addWorldClock() {
            const select = document.getElementById('timezoneSelect');
            const zone = select.value;
            const name = select.options[select.selectedIndex].text;

            // Prevent duplicates
            if (worldClocks.some(c => c.zone === zone)) {
                alert("This clock is already added to your hub.");
                return;
            }

            worldClocks.push({ name: name, zone: zone, isLocal: false });
            updateClocks();
        }

        function removeWorldClock(index) {
            worldClocks.splice(index, 1);
            updateClocks();
        }
    </script>
</body>
</html>
